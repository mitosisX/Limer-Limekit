# Builds portable Limer for Windows, Linux and macOS, proves each one works,
# and puts them on a draft GitHub Release.
#
#   git tag v2.0.1 && git push origin v2.0.1     -> builds + a draft release
#   push to the release-test branch              -> builds and checks only
#
# A draft is visible only to the repo's owner until they click Publish, so a
# broken build never reaches anyone. Every build has to pass
# packaging/smoke_test.py -- imports, a project run, Limer starting, a real
# Build -- or there is no release at all.
#
# Limekit is checked out at the same tag as Limer (tag both repos), or at
# main for the release-test branch.

name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release-test"]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: build / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows, bundle: dist/Limer }
          - { os: ubuntu-latest, label: linux, bundle: dist/Limer }
          - { os: macos-latest, label: macos, bundle: dist/Limer.app }        # Apple silicon
          - { os: macos-15-intel, label: macos-intel, bundle: dist/Limer.app }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: mitosisX/Limekit
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
          path: limekit-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pillow draws the icons; PyInstaller's icon tool stamps Limer.exe.
      # Neither ships -- the bundle gets its own copies from pip.
      - name: Install icon tools
        run: python -m pip install pillow pyinstaller

      # Qt dlopens these even off-screen. Users need them too; the release
      # notes say so.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      - name: The tag matches Limer's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import json; print(json.load(open('app.json'))['project']['version'])")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} but app.json says $version"
            exit 1
          fi

      - name: Build portable Limer
        run: |
          set -o pipefail
          python packaging/package_portable.py --limekit limekit-src --zip 2>&1 | tee build.log

      # Each download must be named for its version and system; two builds
      # with one name would overwrite each other on the release.
      - name: The download is named for this build
        run: |
          version=$(python -c "import json; print(json.load(open('app.json'))['project']['version'])")
          ls dist/Limer-$version-${{ matrix.label }}.zip dist/Limer-$version-${{ matrix.label }}.tar.gz 2>/dev/null | grep .             || { echo "::error::no dist/Limer-$version-${{ matrix.label }}.* -- found: $(ls dist)"; exit 1; }

      - name: Smoke test
        run: |
          set -o pipefail
          python packaging/smoke_test.py ${{ matrix.bundle }} 2>&1 | tee smoke.log

      # The end of each log as an annotation: readable from the run's page
      # without downloading anything.
      - name: Explain a failure
        if: failure()
        run: |
          python - <<'EOF'
          from pathlib import Path
          for name in ("smoke.log", "build.log"):
              log = Path(name)
              if log.exists():
                  tail = log.read_text(errors="replace")[-3000:]
                  tail = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={name}::{tail}")
                  break
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: Limer-${{ matrix.label }}
          path: |
            dist/Limer-*.zip
            dist/Limer-*.tar.gz
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="packaging/release-notes/$TAG.md"
          # Built again for a tag whose draft already exists: replace its
          # files, and drop any the new build no longer makes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            for name in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" assets/* --clobber
            if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" assets/* --draft --title "Limer ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" assets/* --draft --title "Limer ${TAG#v}" --generate-notes
          fi
