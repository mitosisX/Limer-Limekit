# Limer's checks, on Windows, macOS and Linux.
#
# `test` runs on every push: Limer's own test project (tests/, a Limekit
# project that exits non-zero when a check fails) and a staleness check on
# the Ctrl+K API index, which is generated from Limekit's registry.
#
# `build` runs only when started by hand (Actions -> CI -> Run workflow):
# it assembles portable Limer (package_portable.py -- a bundled Python, not a
# PyInstaller freeze) and uploads the zip as a workflow artifact. Windows only
# until the portable build supports Linux and macOS. Attaching it to a GitHub
# Release is a separate step, not wired up yet.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Limer ships no Python of its own; the framework comes from its repo.
# Switch `ref` to main once limekit-2.0 is merged.
env:
  LIMEKIT_REF: limekit-2.0
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: mitosisX/Limekit
          ref: ${{ env.LIMEKIT_REF }}
          path: limekit-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Qt dlopens these even when rendering offscreen. Same list as
      # docker/Dockerfile.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      - name: Install Limekit
        run: python -m pip install -e ./limekit-src

      - name: Test
        run: python -m limekit tests

      - name: API index is up to date
        run: python limekit-src/tools/generate_api_index.py --check .

  build:
    name: build / windows
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: mitosisX/Limekit
          ref: ${{ env.LIMEKIT_REF }}
          path: limekit-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Only for giving Limer.exe its icon; nothing from here ships.
      - name: Install icon tools
        run: python -m pip install pillow pyinstaller

      - name: Build portable Limer
        run: python package_portable.py --limekit limekit-src --zip

      - uses: actions/upload-artifact@v7
        with:
          name: Limer-windows
          path: dist/*.zip
          if-no-files-found: error
