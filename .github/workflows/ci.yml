# Limer's checks, on Windows, macOS and Linux.
#
# `test` runs on every push: Limer's own test project (tests/, a Limekit
# project that exits non-zero when a check fails) and a staleness check on
# the Ctrl+K API index, which is generated from Limekit's registry.
#
# Building the downloads is release.yml's job.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The framework comes from its own repo.
env:
  LIMEKIT_REF: main
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: mitosisX/Limekit
          ref: ${{ env.LIMEKIT_REF }}
          path: limekit-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Qt dlopens these even when rendering offscreen. Same list as
      # docker/Dockerfile.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      - name: Install Limekit
        run: python -m pip install -e ./limekit-src

      - name: Test
        run: python -m limekit tests

      - name: API index is up to date
        run: python limekit-src/tools/generate_api_index.py --check .
